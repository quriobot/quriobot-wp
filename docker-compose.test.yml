# Self-contained WordPress stack for the integration tests.
# Deliberately separate from docker-compose.yml (the dev stack) so running tests
# never touches the developer's database or wp-content.
services:

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wptest
      MYSQL_USER: wptest
      MYSQL_PASSWORD: wptest
      MYSQL_RANDOM_ROOT_PASSWORD: '1'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uwptest", "-pwptest"]
      interval: 3s
      timeout: 5s
      retries: 30

  wordpress:
    # Always supplied by tests/run.sh, which owns the default.
    image: ${WP_IMAGE}
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wptest
      WORDPRESS_DB_PASSWORD: wptest
      WORDPRESS_DB_NAME: wptest
      # Surface every deprecation and notice; the suite asserts none are raised.
      WORDPRESS_DEBUG: '1'
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_DEBUG_LOG', false );
    volumes:
      - wp:/var/www/html
      # The plugin is mounted from the built distributable, not the working tree,
      # so the suite exercises exactly the files that ship. tests/run.sh builds
      # .dist/quriobot from .distignore before starting the stack.
      - ./.dist/quriobot:/var/www/html/wp-content/plugins/quriobot:ro
      - ./tests:/tests:ro

  cli:
    image: wordpress:cli
    depends_on:
      - wordpress
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wptest
      WORDPRESS_DB_PASSWORD: wptest
      WORDPRESS_DB_NAME: wptest
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - wp:/var/www/html
      - ./.dist/quriobot:/var/www/html/wp-content/plugins/quriobot:ro
      - ./tests:/tests:ro
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  wp:
